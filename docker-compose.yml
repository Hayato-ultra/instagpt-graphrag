version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kgai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kgai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_graph}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kgai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kgai}:${POSTGRES_PASSWORD:-kgai_secret}@postgres:5432/${POSTGRES_DB:-knowledge_graph}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/prompts:/app/prompts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kgai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
