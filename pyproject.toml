[project]
name = "instagpt-graphrag"
version = "0.1.0"
description = "URL-to-Knowledge-Graph Pipeline: Transcribe URLs, enrich with web search, categorize, and store in neural graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "asyncio-throttle>=1.0",
    "tenacity>=8.2",
    
    # Web scraping & extraction
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "readability-lxml>=0.8",
    "trafilatura>=1.6",
    "playwright>=1.44",
    
    # NLP & Embeddings
    "openai>=1.35",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "nltk>=3.8",
    
    # Vector DB
    "qdrant-client>=1.10",
    
    # Search
    "duckduckgo-search>=7.2",
    "googlesearch-python>=1.2",
    
    # Graph
    "networkx>=3.2",
    "neo4j>=5.14",
    
    # Frontend
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
    
    # Utils
    "orjson>=3.10",
    "pyyaml>=6.0",
    "rich>=13.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "PTH", "SIM", "T20"]
ignore = ["S101", "PTH207"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring live Postgres/Neo4j (deselect with '-m \"not integration\"')",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"